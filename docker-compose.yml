services:
  postgres-db:
    image: postgres:15-alpine
    container_name: gestao_ativos_backend_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestao_ativos_backend
    ports:
      - "5432:5432"
    volumes:
      - gestao_ativos_backend_db_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gestao_ativos_backend_db_data:
